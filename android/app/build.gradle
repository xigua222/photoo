def detectColorCardHaldLevel = { File sourceFile ->
    def image = ImageIO.read(sourceFile)
    if (image == null) {
        return null
    }
    def width = image.width
    def height = image.height
    if (width <= 0 || width != height) {
        return null
    }
    def level = Math.round(Math.cbrt((double) width))
    if (level <= 0) {
        return null
    }
    return (level * level * level) == width ? (int) level : null
}

def normalizeColorCardHaldTitle = { String fileName ->
    def stem = fileName.replaceFirst(/\.[^.]+$/, "")
    def cleaned = stem
            .replaceAll(/(?i)\s*-\s*converted with color(?:\s*\(\d+\))?/, "")
            .replaceAll(/(?i)\.jpg/, "")
            .replaceAll(/(?i)_srgb/, "")
            .replaceAll(/[_]+/, " ")
            .replaceAll(/\s+/, " ")
            .trim()
    return cleaned ?: stem
}

def slugifyColorCardHaldId = { String text ->
    def slug = text
            .toLowerCase(Locale.US)
            .replaceAll(/[^a-z0-9]+/, "-")
            .replaceAll(/^-+|-+$/, "")
    return slug ?: "hald-filter"
}

def parseColorCardJSeriesAsset = { File sourceFile ->
    if (!sourceFile.parentFile?.name?.equalsIgnoreCase("J")) {
        return null
    }
    def name = sourceFile.name
    def matcher = (name =~ /\((\d+)\)(?=\.[^.]+$)/)
    def ordinal = matcher.find() ? (Integer.parseInt(matcher.group(1)) + 1) : 1
    return [
            assetId: "j-fresh-bright-${ordinal}",
            title  : "清新透亮"
    ]
}

