// Keep every release mapping: crash logs carry the R8 map id ("r8-map-id-<id>"), and retracing
// needs that exact file, which the next release build would overwrite.
// Archive: <android>/mapping-archive/v<name>-<code>-<map id prefix>/mapping.txt (gitignored).
tasks.configureEach { task ->
    if (task.name == 'minifyReleaseWithR8') {
        task.doLast {
            def mapping = file("$buildDir/outputs/mapping/release/mapping.txt")
            if (!mapping.exists()) {
                mapping = file("$buildDir/intermediates/mapping/release/minifyReleaseWithR8/mapping.txt")
            }
            if (!mapping.exists()) return
            def mapId = 'unknown'
            mapping.withReader { reader ->
                for (int i = 0; i < 20; i++) {
                    def line = reader.readLine()
                    if (line == null) break
                    if (line.startsWith('# pg_map_id: ')) {
                        mapId = line.substring('# pg_map_id: '.length()).trim()
                        break
                    }
                }
            }
            def config = android.defaultConfig
            def dest = rootProject.file("mapping-archive/v${config.versionName}-${config.versionCode}-${mapId.take(12)}")
            dest.mkdirs()
            copy {
                from mapping
                into dest
            }
            logger.lifecycle("R8 mapping archived to ${dest}")
        }
    }
}
