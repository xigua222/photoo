// Cross-platform Android SDK / NDK path resolution
def detectAndroidSdkDir = {
    // 1. ANDROID_HOME / ANDROID_SDK_ROOT environment variable
    def envSdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (envSdk && new File(envSdk).isDirectory()) return envSdk
    // 2. local.properties sdk.dir
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        def props = new Properties()
        localPropsFile.withInputStream { props.load(it) }
        def sdkDir = props.getProperty('sdk.dir')
        if (sdkDir && new File(sdkDir).isDirectory()) return sdkDir
    }
    // 3. Platform-specific default locations
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (os.contains('windows')) {
        def localAppData = System.getenv('LOCALAPPDATA')
        if (localAppData) return "${localAppData}/Android/Sdk"
    } else if (os.contains('mac')) {
        def macDefault = "${System.getProperty('user.home')}/Library/Android/sdk"
        if (new File(macDefault).isDirectory()) return macDefault
    } else {
        def linuxDefault = "${System.getProperty('user.home')}/Android/Sdk"
        if (new File(linuxDefault).isDirectory()) return linuxDefault
    }
    return null
}
def androidSdkDir = detectAndroidSdkDir()
def detectNdkPrebuiltDir = {
    if (!androidSdkDir) return null
    def ndkBase = new File(androidSdkDir, 'ndk')
    if (!ndkBase.isDirectory()) return null
    def versions = ndkBase.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }
    return versions ? versions.last().absolutePath : null
}
def ndkPrebuiltDir = detectNdkPrebuiltDir()
def detectHostTag = {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    if (os.contains('windows')) return 'windows-x86_64'
    if (os.contains('mac')) return arch.contains('aarch64') || arch.contains('arm') ? 'darwin-arm64' : 'darwin-x86_64'
    return 'linux-x86_64'
}
