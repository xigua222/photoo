def refreshColorCardFilmGrainAssets = tasks.register("refreshColorCardFilmGrainAssets") {
    def sourceSpecs = [
            [
                    dir         : rootProject.file("32 film grain textures overlays 4K"),
                    idPrefix    : "film-grain-core",
                    outputPrefix: "grain-core",
                    titlePrefix : "G"
            ],
            [
                    dir         : rootProject.file("Film-Grain-Textures-FREE-Pack-8K"),
                    idPrefix    : "film-grain-8k",
                    outputPrefix: "grain-8k",
                    titlePrefix : "K"
            ],
            [
                    dir         : rootProject.file("Textures"),
                    idPrefix    : "film-texture",
                    outputPrefix: "texture",
                    titlePrefix : "T"
            ]
    ]
    def manifestFile = prebuiltFilmGrainManifestFile

    sourceSpecs.each { spec ->
        inputs.dir(spec.dir)
    }
    outputs.dir(prebuiltFilmGrainAssetsDir)
    outputs.file(manifestFile)

    doLast {
        prebuiltColorCardAssetsDir.mkdirs()
        delete(prebuiltFilmGrainAssetsDir)
        prebuiltFilmGrainAssetsDir.mkdirs()
        delete(manifestFile)

        if (!sourceSpecs.any { it.dir.exists() }) {
            manifestFile.setText("[]", "UTF-8")
            return
        }

        def ffmpegBinary = (System.getenv("FFMPEG_BINARY") ?: "ffmpeg").trim()
        def entries = []
        def extractOrdinal = { File file, int fallbackOrdinal ->
            def stem = file.name.replaceFirst(/\.[^.]+$/, "")
            stem = stem.replaceFirst(/(?i)(?:[-_\s])\d+K$/, "")
            def trailingMatcher = (stem =~ /(\d+)(?!.*\d)/)
            if (trailingMatcher.find()) {
                return Integer.parseInt(trailingMatcher.group(1))
            }
            def lastOrdinal = null
            def anyMatcher = (stem =~ /(\d+)/)
            while (anyMatcher.find()) {
                lastOrdinal = Integer.parseInt(anyMatcher.group(1))
            }
            return lastOrdinal ?: fallbackOrdinal
        }
        sourceSpecs.each { spec ->
            if (!spec.dir.exists()) {
                return
            }

            def sourceFiles = fileTree(spec.dir) {
                include "**/*.jpg", "**/*.jpeg", "**/*.png"
            }.files.sort { left, right ->
                def leftOrdinal = extractOrdinal(left, Integer.MAX_VALUE)
                def rightOrdinal = extractOrdinal(right, Integer.MAX_VALUE)
                leftOrdinal <=> rightOrdinal ?: left.absolutePath <=> right.absolutePath
            }

            sourceFiles.eachWithIndex { File sourceFile, int index ->
                def ordinal = extractOrdinal(sourceFile, index + 1)
                def uniqueId = String.format(Locale.US, "%s-%02d", spec.idPrefix, ordinal)
                def title = String.format(Locale.US, "%s%02d", spec.titlePrefix, ordinal)
                def outputFile = new File(
                        prebuiltFilmGrainAssetsDir,
                        String.format(Locale.US, "%s-%02d.webp", spec.outputPrefix, ordinal)
                )

                exec {
                    commandLine ffmpegBinary,
                            "-hide_banner",
                            "-loglevel", "error",
                            "-y",
                            "-i", sourceFile.absolutePath,
                            "-vf", "scale='if(gt(iw,ih),640,-2)':'if(gt(iw,ih),-2,640)':flags=lanczos,format=gray",
                            "-c:v", "libwebp",
                            "-quality", "60",
                            "-compression_level", "6",
                            outputFile.absolutePath
                }

                entries << [
                        id       : uniqueId,
                        title    : title,
                        assetName: "color_card_film_grain/${outputFile.name}",
                        sortOrder: entries.size()
                ]
            }
        }

        manifestFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(entries)),
                "UTF-8"
        )
    }
}

