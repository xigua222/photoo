                        from(sourceFile)
                        into(generatedAiMnnAssetsDir)
                    }

                    def stem = sourceFile.name.replaceFirst(/\.[^.]+$/, "")
                    def normalizedStem = stem.trim().toLowerCase(Locale.US)
                    def title = [
                            "classic_neg": "NC",
                            "v"          : "NV"
                    ][normalizedStem] ?: stem
                            .replaceAll(/[_-]+/, " ")
                            .trim()
                            .split(/\s+/)
                            .collect { token -> token ? token.substring(0, 1).toUpperCase(Locale.US) + token.substring(1) : token }
                            .join(" ")

                    entries << [
                            id              : "ai-mnn-${index + 1}",
                            title           : title ?: "AI ${index + 1}",
                            assetName       : "color_card_ai/filters/${targetFile.name}",
                            inputColorOrder : "RGB",
                            outputColorOrder: "RGB",
                            inputLayout     : "NCHW",
                            outputLayout    : "NCHW",
                            threadCount     : 2
                    ]
                }

        generatedManifestFile.parentFile.mkdirs()
        generatedManifestFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson([
                        id     : "ai-mnn-series",
                        title  : "AI 调色",
                        filters: entries
                ])),
                "UTF-8"
        )
    }
}

def syncColorCardAiMnnJniLibs = tasks.register("syncColorCardAiMnnJniLibs") {
    def outputArm64Dir = file("$generatedAiMnnJniDir/arm64-v8a")
    def builtLibMnnFile = file("$mnnRuntimeBuildDir/libMNN.so")
    def builtLibMnnClFile = file("$mnnRuntimeBuildDir/libMNN_CL.so")
    def builtLibMnnCoreFile = file("$mnnRuntimeBuildDir/source/jni/libmnncore.so")

    def buildScriptPs1 = file("$rootDir/scripts/build_mnn_runtime.ps1")
    if (buildScriptPs1.exists()) {
        inputs.file(buildScriptPs1)
    }
    inputs.property("usePrebuiltMnnJni", usePrebuiltMnnJni)
    inputs.property("refreshPrebuiltMnnJni", refreshPrebuiltMnnJni)
    if (mnnSourceRootDir.exists()) {
        inputs.dir(mnnSourceRootDir)
    }
    if (prebuiltAiMnnJniArm64Dir.exists()) {
        inputs.dir(prebuiltAiMnnJniArm64Dir)
    }
    outputs.dir(generatedAiMnnJniDir)

    doLast {
        def requiredNames = [
                "libMNN.so",
                "libMNN_CL.so",
                "libmnncore.so",
                "libc++_shared.so"
        ]
        def prebuiltRequiredFiles = requiredNames.collect { fileName ->
            new File(prebuiltAiMnnJniArm64Dir, fileName)
        }
        def prebuiltReady = prebuiltRequiredFiles.every { file -> file.exists() }
        generatedAiMnnJniDir.mkdirs()
        delete(generatedAiMnnJniDir)
        outputArm64Dir.mkdirs()

        if (usePrebuiltMnnJni && !refreshPrebuiltMnnJni && prebuiltReady) {
            copy {
                from(prebuiltAiMnnJniArm64Dir)
                into(outputArm64Dir)
            }
            logger.lifecycle("syncColorCardAiMnnJniLibs: using prebuilt JNI cache")
            return
        }

        if (!mnnSourceRootDir.exists()) {
            if (prebuiltReady) {
                copy {
                    from(prebuiltAiMnnJniArm64Dir)
                    into(outputArm64Dir)
                }
                logger.lifecycle("syncColorCardAiMnnJniLibs: MNN source missing, fallback to prebuilt JNI cache")
                return
            }
            throw new GradleException("Missing local MNN source checkout: ${mnnSourceRootDir.absolutePath}")
        }

        if (!builtLibMnnFile.exists() || !builtLibMnnClFile.exists() || !builtLibMnnCoreFile.exists()) {
            def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
            if (osName.contains('windows')) {
                exec {
                    workingDir(rootDir)
                    commandLine "powershell", "-ExecutionPolicy", "Bypass", "-File", file("$rootDir/scripts/build_mnn_runtime.ps1").absolutePath
                }
            } else {
                throw new GradleException(
                    "MNN runtime prebuilt .so files not found and auto-build is only supported on Windows.\n" +
                    "Please build MNN manually or provide prebuilt files in: ${mnnRuntimeBuildDir}\n" +
                    "Alternatively, set usePrebuiltMnnJni=true in gradle.properties and place .so files in: ${prebuiltAiMnnJniArm64Dir}")
            }
        }

        copy {
            from(builtLibMnnFile)
            from(builtLibMnnClFile)
            from(builtLibMnnCoreFile)
            from(arm64LibcxxSharedFile)
            into(outputArm64Dir)
        }

        def requiredFiles = requiredNames.collect { fileName ->
            new File(outputArm64Dir, fileName)
        }
        requiredFiles.each { file ->
            if (!file.exists()) {
                throw new GradleException("Missing extracted MNN runtime library: ${file.absolutePath}")
            }
        }

        if (usePrebuiltMnnJni) {
            delete(prebuiltAiMnnJniArm64Dir)
            prebuiltAiMnnJniArm64Dir.mkdirs()
            copy {
                from(outputArm64Dir)
                into(prebuiltAiMnnJniArm64Dir)
            }
        }
    }
}

android {
    namespace = "com.voicelike.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.photoo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 41
        versionName "4.1"
        buildConfigField "boolean", "CAMPFIRE_PAY_ENABLED", "false"
        buildConfigField "String", "CAMPFIRE_PAY_BASE_URL", "\"${campfirePayBaseUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            noCompress 'tflite'
        }
    }

    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a"
            universalApk = false
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        // Kotlin 2.3 + current Compose lint stack crashes in this detector.
        disable 'CoroutineCreationDuringComposition'
        disable 'UnrememberedAnimatable'
        disable 'ProduceStateDoesNotAssignValue'
        // Quality gate: exempt pre-existing issues, only block new ones.
        baseline = file("lint-baseline.xml")
        // Release speed: lintVital re-ran the full lint pass on every assembleRelease.
        // Run `./gradlew :app:lint` explicitly when a lint pass is wanted.
        checkReleaseBuilds = false
    }
    sourceSets {
        main {
            assets.srcDir generatedColorCardAssetsDir
            jniLibs.srcDirs = ['src/main/jniLibs', generatedAiMnnJniDir.absolutePath]
        }
    }
}

