        def applyPaletteTonePreview = { source, previewColors, contrast, saturationBoost ->
            def output = createArgbImage(source.width, source.height)
            def palette = previewColors.collect { colorValue ->
                if (colorValue instanceof String) {
                    def normalized = colorValue.toString().replace("#", "")
                    Integer.parseInt(normalized, 16)
                } else {
                    colorValue as Integer
                }
            }
            if (palette.isEmpty()) {
                return copyArgb(source)
            }
            for (int y = 0; y < source.height; y++) {
                for (int x = 0; x < source.width; x++) {
                    int argb = source.getRGB(x, y)
                    int alpha = (argb >>> 24) & 0xFF
                    int red = (argb >>> 16) & 0xFF
                    int green = (argb >>> 8) & 0xFF
                    int blue = argb & 0xFF
                    double luma = ((red * 0.299d) + (green * 0.587d) + (blue * 0.114d)) / 255d
                    double contrasted = clamp01((((luma - 0.5d) * contrast) + 0.5d))
                    double scaledIndex = contrasted * Math.max(0, palette.size() - 1)
                    int leftIndex = Math.floor(scaledIndex).intValue()
                    int rightIndex = Math.min(palette.size() - 1, leftIndex + 1)
                    double mix = scaledIndex - leftIndex
                    int leftColor = palette[leftIndex]
                    int rightColor = palette[rightIndex]
                    double toneRed = (((leftColor >>> 16) & 0xFF) * (1d - mix)) + (((rightColor >>> 16) & 0xFF) * mix)
                    double toneGreen = (((leftColor >>> 8) & 0xFF) * (1d - mix)) + (((rightColor >>> 8) & 0xFF) * mix)
                    double toneBlue = ((leftColor & 0xFF) * (1d - mix)) + ((rightColor & 0xFF) * mix)
                    double sourceGray = luma * 255d
                    double boostedRed = sourceGray + ((toneRed - sourceGray) * saturationBoost)
                    double boostedGreen = sourceGray + ((toneGreen - sourceGray) * saturationBoost)
                    double boostedBlue = sourceGray + ((toneBlue - sourceGray) * saturationBoost)
                    int nr = clamp255(boostedRed)
                    int ng = clamp255(boostedGreen)
                    int nb = clamp255(boostedBlue)
                    output.setRGB(x, y, ((alpha & 0xFF) << 24) | ((nr & 0xFF) << 16) | ((ng & 0xFF) << 8) | (nb & 0xFF))
                }
            }
            output
        }
        def renderFfmpegHaldPreview = { BufferedImage source, String haldAssetName, String tempBaseName ->
            def haldFile = new File(prebuiltColorCardAssetsDir, haldAssetName)
            if (!haldFile.exists()) {
                haldFile = new File(generatedColorCardAssetsDir, haldAssetName)
            }
            if (!haldFile.exists()) {
                return copyArgb(source)
            }
            def sourcePngFile = new File(temporaryDir, "${tempBaseName}_source.png")
            def outputPngFile = new File(temporaryDir, "${tempBaseName}_output.png")
            sourcePngFile.parentFile.mkdirs()
            sourcePngFile.delete()
            outputPngFile.delete()
            ImageIO.write(source, "png", sourcePngFile)
            try {
                def result = exec {
                    ignoreExitValue = true
                    commandLine ffmpegBinary,
                            "-hide_banner",
                            "-loglevel", "error",
                            "-y",
                            "-i", sourcePngFile.absolutePath,
                            "-i", haldFile.absolutePath,
                            "-filter_complex", "[0:v][1:v]haldclut",
                            outputPngFile.absolutePath
                }
                if (result.exitValue == 0 && outputPngFile.exists() && outputPngFile.length() > 0) {
                    def rendered = ImageIO.read(outputPngFile)
                    if (rendered != null) {
                        return rendered
                    }
                }
            } catch (Exception ignored) {
            } finally {
                sourcePngFile.delete()
                outputPngFile.delete()
            }
            copyArgb(source)
        }
        def applyBlackMistPreview = { BufferedImage source ->
            def output = createArgbImage(source.width, source.height)
            def tint = [246d, 217d, 238d]
            for (int y = 0; y < source.height; y++) {
                for (int x = 0; x < source.width; x++) {
                    int argb = source.getRGB(x, y)
                    int alpha = (argb >>> 24) & 0xFF
                    int red = (argb >>> 16) & 0xFF
                    int green = (argb >>> 8) & 0xFF
                    int blue = argb & 0xFF
                    double blurRed = 0d
                    double blurGreen = 0d
                    double blurBlue = 0d
                    double weightSum = 0d
                    for (int dy = -2; dy <= 2; dy++) {
                        for (int dx = -2; dx <= 2; dx++) {
                            double weight = (dx == 0 && dy == 0) ? 4d : ((Math.abs(dx) + Math.abs(dy)) <= 2 ? 1.5d : 0.75d)
                            int sample = sampleColor(source, x + dx, y + dy)
                            blurRed += (((sample >>> 16) & 0xFF) * weight)
                            blurGreen += (((sample >>> 8) & 0xFF) * weight)
                            blurBlue += ((sample & 0xFF) * weight)
                            weightSum += weight
                        }
                    }
                    blurRed /= Math.max(0.0001d, weightSum)
                    blurGreen /= Math.max(0.0001d, weightSum)
                    blurBlue /= Math.max(0.0001d, weightSum)
                    double luma = ((red * 0.299d) + (green * 0.587d) + (blue * 0.114d)) / 255d
                    double highlight = clamp01((luma - 0.56d) / 0.40d)
                    double softnessMix = 0.22d
                    double bloomAmount = highlight * 0.32d
                    double veilLift = (1d - luma) * 0.04d * 255d
                    double glowRed = (blurRed * 0.70d) + (tint[0] * 0.30d)
                    double glowGreen = (blurGreen * 0.76d) + (tint[1] * 0.24d)
                    double glowBlue = (blurBlue * 0.64d) + (tint[2] * 0.36d)
                    int nr = clamp255((red * (1d - softnessMix)) + (blurRed * softnessMix) + (glowRed * bloomAmount) + veilLift)
                    int ng = clamp255((green * (1d - softnessMix)) + (blurGreen * softnessMix) + (glowGreen * bloomAmount) + veilLift)
                    int nb = clamp255((blue * (1d - softnessMix)) + (blurBlue * softnessMix) + (glowBlue * bloomAmount) + veilLift)
                    output.setRGB(x, y, ((alpha & 0xFF) << 24) | ((nr & 0xFF) << 16) | ((ng & 0xFF) << 8) | (nb & 0xFF))
                }
            }
            output
        }
        def applySubjectFramePreview = { BufferedImage source ->
            def output = createArgbImage(source.width, source.height)
            double aspect = source.width / Math.max(1d, source.height as double)
            double rectWidth = aspect >= 1.35d ? 0.66d : (aspect <= 0.82d ? 0.54d : 0.60d)
            double rectHeight = Math.max(0.42d, Math.min(0.72d, 0.33d / Math.max(0.001d, rectWidth)))
            double centerX = 0.5d
            double centerY = 0.48d
            double left = Math.max(0d, centerX - (rectWidth / 2d))
            double right = Math.min(1d, centerX + (rectWidth / 2d))
            double top = Math.max(0d, centerY - (rectHeight / 2d))
            double bottom = Math.min(1d, centerY + (rectHeight / 2d))
            double borderThickness = 0.0085d
            def border = [247, 243, 236]
            for (int y = 0; y < source.height; y++) {
                double ny = source.height <= 1 ? 0.5d : y / Math.max(1d, (source.height - 1) as double)
                for (int x = 0; x < source.width; x++) {
                    double nx = source.width <= 1 ? 0.5d : x / Math.max(1d, (source.width - 1) as double)
                    int argb = source.getRGB(x, y)
                    int alpha = (argb >>> 24) & 0xFF
                    int red = (argb >>> 16) & 0xFF
                    int green = (argb >>> 8) & 0xFF
                    int blue = argb & 0xFF
                    boolean inside = nx >= left && nx <= right && ny >= top && ny <= bottom
                    boolean onBorder =
                            inside &&
                                    (
                                            Math.abs(nx - left) <= borderThickness ||
                                                    Math.abs(nx - right) <= borderThickness ||
                                                    Math.abs(ny - top) <= borderThickness ||
                                                    Math.abs(ny - bottom) <= borderThickness
                                    )
                    if (onBorder) {
                        output.setRGB(x, y, ((alpha & 0xFF) << 24) | ((border[0] & 0xFF) << 16) | ((border[1] & 0xFF) << 8) | (border[2] & 0xFF))
                        continue
                    }
                    if (inside) {
                        output.setRGB(x, y, argb)
                        continue
                    }
                    int gray = clamp255((red * 0.299d) + (green * 0.587d) + (blue * 0.114d))
                    output.setRGB(x, y, ((alpha & 0xFF) << 24) | ((gray & 0xFF) << 16) | ((gray & 0xFF) << 8) | (gray & 0xFF))
                }
            }
            output
        }
        def writeOptimizedPreviewAsset = { BufferedImage image, String baseName, boolean preserveSharpEdges = false ->
            def webpFile = new File(bootstrapOutputDir, "${baseName}.webp")
            def tempPngFile = new File(temporaryDir, "${baseName}.png")
            tempPngFile.parentFile.mkdirs()
            tempPngFile.delete()
            webpFile.delete()
            def optimizedImage = scalePreviewImage(
                    image,
                    preserveSharpEdges ? 640 : 520,
                    preserveSharpEdges
            )
            ImageIO.write(optimizedImage, "png", tempPngFile)
            def finalAssetName = "color_card_filter_feed_bootstrap/${webpFile.name}"
            try {
                def result = exec {
                    ignoreExitValue = true
                    commandLine ffmpegBinary,
                            "-hide_banner",
                            "-loglevel", "error",
                            "-y",
                            "-i", tempPngFile.absolutePath,
                            "-c:v", "libwebp",
                            "-quality", preserveSharpEdges ? "72" : "64",
                            "-compression_level", "6",
                            webpFile.absolutePath
                }
                if (result.exitValue == 0 &&
                        webpFile.exists() &&
                        webpFile.length() > 0) {
                    finalAssetName = "color_card_filter_feed_bootstrap/${webpFile.name}"
                } else {
                    throw new GradleException("Failed to encode bootstrap asset as webp: ${baseName}")
                }
            } catch (Exception ignored) {
                webpFile.delete()
                throw new GradleException("Failed to encode bootstrap asset as webp: ${baseName}", ignored)
            } finally {
                tempPngFile.delete()
            }
            finalAssetName
        }

