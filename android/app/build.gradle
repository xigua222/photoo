def syncColorCardFilterPreviewSampleAsset = tasks.register("syncColorCardFilterPreviewSampleAsset") {
    def fallbackSourceFile = rootProject.file("slj.png")
    def webpFile = file("$generatedColorCardAssetsDir/color_card_filter_preview_sample.webp")
    def pngFile = file("$generatedColorCardAssetsDir/color_card_filter_preview_sample.png")

    inputs.file(prebuiltFilterFeedDemoManifestFile)
    inputs.dir(prebuiltFilterFeedDemoDir)
    inputs.file(fallbackSourceFile)
    outputs.files(webpFile, pngFile)

    doLast {
        generatedColorCardAssetsDir.mkdirs()
        delete(webpFile)
        delete(pngFile)

        def ffmpegBinary = (System.getenv("FFMPEG_BINARY") ?: "ffmpeg").trim()
        def sourceFile = null as File

        if (generatedFilterFeedDemoManifestFile.exists() && generatedFilterFeedDemoDir.exists()) {
            try {
                def feedAssetFiles = (new JsonSlurper().parse(generatedFilterFeedDemoManifestFile) as List)
                        .findAll { entry ->
                            def id = (entry?.id ?: "").toString()
                            def assetName = (entry?.assetName ?: "").toString()
                            id != "watermark_template_demo" &&
                                    !filterPreviewExcludedFeedSampleIds.contains(id) &&
                                    assetName.startsWith("color_card_filter_feed_demo/")
                        }
                        .collect { entry ->
                            new File(generatedColorCardAssetsDir, (entry?.assetName ?: "").toString())
                        }
                        .findAll { file -> file.exists() && file.length() > 0L }

                if (!feedAssetFiles.isEmpty()) {
                    def montageDir = new File(temporaryDir, "color_card_filter_preview_sample_montage")
                    delete(montageDir)
                    montageDir.mkdirs()

                    def decodedFrames = []
                    feedAssetFiles.eachWithIndex { File assetFile, int index ->
                        def frameFile = new File(montageDir, String.format(Locale.US, "frame_%03d.png", index))
                        frameFile.delete()
                        def decodeResult = exec {
                            ignoreExitValue = true
                            commandLine ffmpegBinary,
                                    "-hide_banner",
                                    "-loglevel", "error",
                                    "-y",
                                    "-i", assetFile.absolutePath,
                                    "-frames:v", "1",
                                    frameFile.absolutePath
                        }
                        if (decodeResult.exitValue == 0 && frameFile.exists() && frameFile.length() > 0L) {
                            decodedFrames << frameFile
                        }
                    }

                    def decodedImages = decodedFrames.collect { frameFile ->
                        try {
                            ImageIO.read(frameFile)
                        } catch (Exception ignored) {
                            null
                        }
                    }.findAll { image -> image != null }

                    if (!decodedImages.isEmpty()) {
                        def tileCount = decodedImages.size() as int
                        def columnCount = Math.max(1, Math.ceil(Math.sqrt(tileCount as double)) as int)
                        def rowCount = Math.max(1, Math.ceil((tileCount as double) / (columnCount as double)) as int)
                        def cellSize = 240
                        def collageWidth = columnCount * cellSize
                        def collageHeight = rowCount * cellSize
                        def collage = new BufferedImage(collageWidth, collageHeight, BufferedImage.TYPE_INT_ARGB)
                        Graphics2D graphics = collage.createGraphics()
                        graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                        graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
                        graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
                        graphics.setColor(new java.awt.Color(20, 20, 20))
                        graphics.fillRect(0, 0, collageWidth, collageHeight)
                        def cellPadding = 8
                        decodedImages.eachWithIndex { BufferedImage image, int index ->
                            def col = index % columnCount
                            def row = (index / columnCount) as int
                            def availableWidth = cellSize - (cellPadding * 2)
                            def availableHeight = cellSize - (cellPadding * 2)
                            def scale = Math.min(
                                    availableWidth / Math.max(1d, image.width as double),
                                    availableHeight / Math.max(1d, image.height as double)
                            )
                            def drawWidth = Math.max(1, Math.round(image.width * scale) as int)
                            def drawHeight = Math.max(1, Math.round(image.height * scale) as int)
                            def drawX = (col * cellSize) + ((cellSize - drawWidth) / 2) as int
                            def drawY = (row * cellSize) + ((cellSize - drawHeight) / 2) as int
                            graphics.drawImage(image, drawX, drawY, drawWidth, drawHeight, null)
                        }
                        graphics.dispose()

                        def collageFile = new File(montageDir, "feed_montage.png")
                        ImageIO.write(collage, "png", collageFile)
                        if (collageFile.exists() && collageFile.length() > 0L) {
                            sourceFile = collageFile
                            logger.lifecycle("syncColorCardFilterPreviewSampleAsset: using feed montage (${decodedImages.size()} samples)")
                        }
                    }
                }
            } catch (Exception ignored) {
                sourceFile = null
            }
        }

        if (sourceFile == null || !sourceFile.exists()) {
            sourceFile = fallbackSourceFile
            logger.lifecycle("syncColorCardFilterPreviewSampleAsset: feed montage unavailable, fallback to slj.png")
        }
        if (!sourceFile.exists()) {
            throw new GradleException("Missing filter preview sample asset: ${sourceFile.absolutePath}")
        }

        def optimizedWebp = new File(temporaryDir, "color_card_filter_preview_sample.webp")
        optimizedWebp.parentFile.mkdirs()
        optimizedWebp.delete()
        def sourceIsWebp = sourceFile.name.toLowerCase(Locale.ROOT).endsWith(".webp")

        def shouldUseWebp = false
        try {
            def result = exec {
                ignoreExitValue = true
                commandLine ffmpegBinary,
                        "-hide_banner",
                        "-loglevel", "error",
                        "-y",
                        "-i", sourceFile.absolutePath,
                        "-c:v", "libwebp",
                        "-quality", "82",
                        "-compression_level", "6",
                        optimizedWebp.absolutePath
            }
            shouldUseWebp = result.exitValue == 0 &&
                    optimizedWebp.exists() &&
                    optimizedWebp.length() > 0 &&
                    optimizedWebp.length() < sourceFile.length()
        } catch (Exception ignored) {
            shouldUseWebp = false
        }
        if (!shouldUseWebp) {
            try {
                def result = exec {
                    ignoreExitValue = true
                    commandLine "cwebp",
                            "-quiet",
                            "-q", "82",
                            sourceFile.absolutePath,
                            "-o", optimizedWebp.absolutePath
                }
                shouldUseWebp = result.exitValue == 0 &&
                        optimizedWebp.exists() &&
                        optimizedWebp.length() > 0 &&
                        optimizedWebp.length() < sourceFile.length()
            } catch (Exception ignored) {
                shouldUseWebp = false
            }
        }
        if (!shouldUseWebp) {
            // Pillow keeps alpha plane straight; only lossy RGB is acceptable here.
            try {
                def result = exec {
                    ignoreExitValue = true
                    commandLine "python3", "-c",
                            "from PIL import Image; import sys; Image.open(sys.argv[1]).convert('RGBA' if Image.open(sys.argv[1]).mode in ('RGBA','LA','P') else 'RGB').save(sys.argv[2], 'WEBP', quality=82, method=6)",
                            sourceFile.absolutePath,
                            optimizedWebp.absolutePath
                }
                shouldUseWebp = result.exitValue == 0 &&
                        optimizedWebp.exists() &&
                        optimizedWebp.length() > 0 &&
                        optimizedWebp.length() < sourceFile.length()
            } catch (Exception ignored) {
                shouldUseWebp = false
            }
        }
        def useWebpOutput = shouldUseWebp || sourceIsWebp

        copy {
            from(shouldUseWebp ? optimizedWebp : sourceFile)
            into(generatedColorCardAssetsDir)
            rename { useWebpOutput ? webpFile.name : pngFile.name }
        }
    }
}
def syncColorCardFilterFeedDemoAssets = tasks.register("syncColorCardFilterFeedDemoAssets") {
    def sourceDir = rootProject.file("demo")
    def legacyWatermarkPreviewFile = file("src/main/res/drawable-nodpi/watermark_template_demo.jpg")
    def outputDir = file("$generatedColorCardAssetsDir/color_card_filter_feed_demo")
    def manifestFile = file("$generatedColorCardAssetsDir/color_card_filter_feed_demo_manifest.json")
    def bootstrapOutputDir = file("$generatedColorCardAssetsDir/color_card_filter_feed_bootstrap")
    def bootstrapManifestFile = file("$generatedColorCardAssetsDir/color_card_filter_feed_bootstrap_manifest.json")

    inputs.dir(sourceDir)
    inputs.file(legacyWatermarkPreviewFile)
    inputs.property("usePrebuiltFeedAssets", usePrebuiltFeedAssets)
    inputs.property("refreshPrebuiltFeedAssets", refreshPrebuiltFeedAssets)
    outputs.dir(outputDir)
    outputs.file(manifestFile)
    outputs.dir(bootstrapOutputDir)
    outputs.file(bootstrapManifestFile)

    doLast {
        delete(outputDir)
        delete(manifestFile)
        delete(bootstrapOutputDir)
        delete(bootstrapManifestFile)
        outputDir.mkdirs()
        bootstrapOutputDir.mkdirs()
        generatedColorCardAssetsDir.mkdirs()

        def prebuiltFeedAssetsReady =
                prebuiltFilterFeedDemoDir.exists() &&
                prebuiltFilterFeedDemoManifestFile.exists() &&
                prebuiltFilterFeedBootstrapDir.exists() &&
                prebuiltFilterFeedBootstrapManifestFile.exists()
        if (usePrebuiltFeedAssets && !refreshPrebuiltFeedAssets && prebuiltFeedAssetsReady) {
            copy {
                from(prebuiltFilterFeedDemoDir)
                into(outputDir)
            }
            copy {
                from(prebuiltFilterFeedDemoManifestFile)
                into(generatedColorCardAssetsDir)
            }
            copy {
                from(prebuiltFilterFeedBootstrapDir)
                into(bootstrapOutputDir)
            }
            copy {
                from(prebuiltFilterFeedBootstrapManifestFile)
                into(generatedColorCardAssetsDir)
            }
            logger.lifecycle("syncColorCardFilterFeedDemoAssets: using prebuilt feed assets cache")
            return
        }

        if (!legacyWatermarkPreviewFile.exists()) {
            throw new GradleException("Missing watermark template demo asset: ${legacyWatermarkPreviewFile.absolutePath}")
        }

        def imageFiles = [legacyWatermarkPreviewFile]
        if (sourceDir.exists()) {
            imageFiles.addAll(
                    sourceDir.listFiles()?.findAll { file ->
                        file.isFile() && file.name.toLowerCase(Locale.ROOT).matches(/.*\.(jpg|jpeg|png|webp)$/)
                    }?.sort { it.name.toLowerCase(Locale.ROOT) } ?: []
            )
        }
        if (!imageFiles || imageFiles.isEmpty()) {
            throw new GradleException("Missing demo filter feed assets: ${sourceDir.absolutePath}")
        }

        def ffmpegBinary = (System.getenv("FFMPEG_BINARY") ?: "ffmpeg").trim()
        def manifestEntries = []
        def generatedDemoEntries = []
        def sampleIndex = 0

        imageFiles.each { sourceFile ->
            def isLegacyWatermarkPreview = sourceFile.absolutePath == legacyWatermarkPreviewFile.absolutePath
            def assetId = isLegacyWatermarkPreview ? "watermark_template_demo" : "sample_${sampleIndex}"
            def outputFileName = isLegacyWatermarkPreview ? "watermark_template_demo.webp" : "sample_${sampleIndex}.webp"
            def sourceImage = ImageIO.read(sourceFile)
            if (sourceImage == null) {
                throw new GradleException("Unsupported demo image: ${sourceFile.absolutePath}")
            }

            def sourceWidth = sourceImage.width
            def sourceHeight = sourceImage.height
            def maxSide = 880d
            def scale = Math.min(1d, maxSide / Math.max(sourceWidth, sourceHeight))
            def targetWidth = Math.max(1, Math.round(sourceWidth * scale) as int)
            def targetHeight = Math.max(1, Math.round(sourceHeight * scale) as int)

            def scaledImage = new BufferedImage(targetWidth, targetHeight, BufferedImage.TYPE_INT_ARGB)
            Graphics2D graphics = scaledImage.createGraphics()
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.drawImage(sourceImage, 0, 0, targetWidth, targetHeight, null)
            graphics.dispose()

            def normalizedImage = scaledImage

            def webpFile = new File(outputDir, outputFileName)
            def tempPngFile = new File(temporaryDir, "color_card_filter_feed_demo_${assetId}.png")
            tempPngFile.parentFile.mkdirs()
            tempPngFile.delete()
            webpFile.delete()
            ImageIO.write(normalizedImage, "png", tempPngFile)
            def finalAssetName = "color_card_filter_feed_demo/${webpFile.name}"

            try {
                def result = exec {
                    ignoreExitValue = true
                    commandLine ffmpegBinary,
                            "-hide_banner",
                            "-loglevel", "error",
                            "-y",
                            "-i", tempPngFile.absolutePath,
                            "-c:v", "libwebp",
                            "-quality", "86",
                            "-compression_level", "6",
                            webpFile.absolutePath
                }
                if (result.exitValue == 0 &&
                        webpFile.exists() &&
                        webpFile.length() > 0) {
                    finalAssetName = "color_card_filter_feed_demo/${webpFile.name}"
                } else {
                    throw new GradleException("Failed to encode demo asset as webp: ${sourceFile.absolutePath}")
                }
            } catch (Exception ignored) {
                webpFile.delete()
                throw new GradleException("Failed to encode demo asset as webp: ${sourceFile.absolutePath}", ignored)
            } finally {
                tempPngFile.delete()
            }

            manifestEntries << [
                    id       : assetId,
                    assetName: finalAssetName
            ]
            generatedDemoEntries << [
                    id       : assetId,
                    assetName: finalAssetName,
                    image    : normalizedImage
            ]
            if (!isLegacyWatermarkPreview) {
                sampleIndex++
            }
        }

        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifestEntries))

        def clamp255 = { double value ->
            Math.max(0, Math.min(255, Math.round(value) as int))
        }
        def clamp01 = { double value ->
            Math.max(0d, Math.min(1d, value))
        }
        def filmSimCanonicalIdByFamily = [
                "5219"      : "film-sim-5219",
                "c200"      : "film-sim-c200",
                "ektar100"  : "film-sim-ektar100",
                "pro400h"   : "film-sim-pro400h",
                "spgold200" : "film-sim-spgold200",
                "tx400"     : "film-sim-tx400",
                "vivid250d" : "film-sim-vivid250d",
                "鍏ㄨ兘400": "film-sim-allround400"
        ]
        def filmSimVariantRegex = java.util.regex.Pattern.compile(
                '^(5219|C200|Ektar100|PRO400H|SPGOLD200|Tx400|vivid250D|鍏ㄨ兘400)((?:[+-]\\d+)|(?:[+-]?[sS]))$',
                java.util.regex.Pattern.CASE_INSENSITIVE
        )
        def resolveBootstrapCanonicalId = { rawId, title ->
            def safeRawId = rawId?.toString()?.trim()
            if (!safeRawId) {
                return null
            }
            def safeTitle = title?.toString()?.trim()
            if (safeTitle?.contains("全能400")) {
                return "film-sim-allround400"
            }
            def matcher = safeTitle ? filmSimVariantRegex.matcher(safeTitle) : null
            if (matcher != null && matcher.matches()) {
                def family = matcher.group(1)?.toLowerCase(Locale.ROOT)
                return filmSimCanonicalIdByFamily[family] ?: safeRawId
            }
            safeRawId
        }
        def rgbToHsv = { int red, int green, int blue ->
            java.awt.Color.RGBtoHSB(red, green, blue, null)
        }
        def hsvToRgb = { float hue, float saturation, float brightness ->
            java.awt.Color.HSBtoRGB(hue, saturation, brightness)
        }
        def createArgbImage = { int width, int height ->
            new BufferedImage(width, height, BufferedImage.TYPE_INT_ARGB)
        }
        def copyArgb = { BufferedImage source ->
            def copy = createArgbImage(source.width, source.height)
            Graphics2D graphics = copy.createGraphics()
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            graphics.drawImage(source, 0, 0, null)
            graphics.dispose()
            copy
        }
        def sampleColor = { BufferedImage image, int sampleX, int sampleY ->
            image.getRGB(
                    Math.max(0, Math.min(image.width - 1, sampleX)),
                    Math.max(0, Math.min(image.height - 1, sampleY))
            )
        }
        def buildFilteredPreview = { BufferedImage filteredImage ->
            def result = createArgbImage(filteredImage.width, filteredImage.height)
            Graphics2D graphics = result.createGraphics()
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            graphics.drawImage(filteredImage, 0, 0, null)
            graphics.dispose()
            result
        }
        def scalePreviewImage = { BufferedImage source, int maxSide, boolean preserveSharpEdges ->
            int safeMaxSide = Math.max(1, maxSide as int)
            int sourceWidth = Math.max(1, source.width)
            int sourceHeight = Math.max(1, source.height)
            double scale = Math.min(1d, safeMaxSide / Math.max(sourceWidth, sourceHeight))
            if (Math.abs(scale - 1d) < 0.0001d) {
                return copyArgb(source)
            }
            int targetWidth = Math.max(1, Math.round(sourceWidth * scale) as int)
            int targetHeight = Math.max(1, Math.round(sourceHeight * scale) as int)
            def scaled = createArgbImage(targetWidth, targetHeight)
            Graphics2D graphics = scaled.createGraphics()
            graphics.setRenderingHint(
                    RenderingHints.KEY_INTERPOLATION,
                    preserveSharpEdges
                            ? RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR
                            : RenderingHints.VALUE_INTERPOLATION_BICUBIC
            )
            graphics.setRenderingHint(
                    RenderingHints.KEY_RENDERING,
                    preserveSharpEdges
                            ? RenderingHints.VALUE_RENDER_SPEED
                            : RenderingHints.VALUE_RENDER_QUALITY
            )
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.drawImage(source, 0, 0, targetWidth, targetHeight, null)
            graphics.dispose()
            scaled
        }
        def applySelectiveRedPreview = { BufferedImage source ->
            def output = createArgbImage(source.width, source.height)
            for (int y = 0; y < source.height; y++) {
                for (int x = 0; x < source.width; x++) {
                    int argb = source.getRGB(x, y)
                    int alpha = (argb >>> 24) & 0xFF
                    int red = (argb >>> 16) & 0xFF
                    int green = (argb >>> 8) & 0xFF
                    int blue = argb & 0xFF
                    float[] hsv = rgbToHsv(red, green, blue)
                    double hue = hsv[0]
                    double sat = hsv[1]
                    double hueDistance = Math.min(Math.abs(hue - 0d), 1d - Math.abs(hue - 0d))
