def formatColorCardPreviewHex = { int rgb ->
    def red = (rgb >> 16) & 0xFF
    def green = (rgb >> 8) & 0xFF
    def blue = rgb & 0xFF
    return String.format("#%02X%02X%02X", red, green, blue)
}

def computeColorCardRawRgbaHash = { String ffmpegBinary, File imageFile ->
    def outputBuffer = new ByteArrayOutputStream()
    def result = exec {
        ignoreExitValue = true
        standardOutput = outputBuffer
        errorOutput = new ByteArrayOutputStream()
        commandLine ffmpegBinary,
                "-hide_banner",
                "-loglevel", "error",
                "-i", imageFile.absolutePath,
                "-f", "rawvideo",
                "-pix_fmt", "rgba",
                "-"
    }
    if (result.exitValue != 0) {
        return null
    }
    return MessageDigest
            .getInstance("MD5")
            .digest(outputBuffer.toByteArray())
            .encodeHex()
            .toString()
}

def sampleColorCardHaldPreviewColors = { image, int haldLevel ->
    def samplePoints = [
            [0.22d, 0.18d, 0.16d],
            [0.48d, 0.42d, 0.38d],
            [0.80d, 0.66d, 0.56d],
            [0.30d, 0.52d, 0.72d],
            [0.90d, 0.92d, 0.94d]
    ]
    def cubeSide = haldLevel * haldLevel
    def imageSide = haldLevel * cubeSide
    def clampUnit = { value -> Math.max(0d, Math.min(1d, value as double)) }
    def lerp = { start, end, amount ->
        (start as double) + (((end as double) - (start as double)) * (amount as double))
    }
    def sampleDiscrete = { rIndex, gIndex, bIndex ->
        def linearIndex = rIndex + (gIndex * cubeSide) + (bIndex * cubeSide * cubeSide)
        def x = linearIndex % imageSide
        def y = (int) (linearIndex / imageSide)
        return image.getRGB(x, y)
    }
    def interpolateChannel = { c000, c100, c010, c110, c001, c101, c011, c111, rf, gf, bf, shift ->
        def ch = { color -> (color >> shift) & 0xFF }
        def c00 = lerp(ch(c000), ch(c100), rf)
        def c10 = lerp(ch(c010), ch(c110), rf)
        def c01 = lerp(ch(c001), ch(c101), rf)
        def c11 = lerp(ch(c011), ch(c111), rf)
        def c0 = lerp(c00, c10, gf)
        def c1 = lerp(c01, c11, gf)
        return (int) Math.round(lerp(c0, c1, bf))
    }

    return samplePoints.collect { point ->
        def r = clampUnit(point[0]) * (cubeSide - 1)
        def g = clampUnit(point[1]) * (cubeSide - 1)
        def b = clampUnit(point[2]) * (cubeSide - 1)

        def r0 = Math.max(0, Math.min(cubeSide - 1, (int) Math.floor(r)))
        def g0 = Math.max(0, Math.min(cubeSide - 1, (int) Math.floor(g)))
        def b0 = Math.max(0, Math.min(cubeSide - 1, (int) Math.floor(b)))
        def r1 = Math.min(cubeSide - 1, r0 + 1)
        def g1 = Math.min(cubeSide - 1, g0 + 1)
        def b1 = Math.min(cubeSide - 1, b0 + 1)

        def rf = clampUnit(r - r0)
        def gf = clampUnit(g - g0)
        def bf = clampUnit(b - b0)

        def c000 = sampleDiscrete(r0, g0, b0)
        def c100 = sampleDiscrete(r1, g0, b0)
        def c010 = sampleDiscrete(r0, g1, b0)
        def c110 = sampleDiscrete(r1, g1, b0)
        def c001 = sampleDiscrete(r0, g0, b1)
        def c101 = sampleDiscrete(r1, g0, b1)
        def c011 = sampleDiscrete(r0, g1, b1)
        def c111 = sampleDiscrete(r1, g1, b1)

        def red = interpolateChannel(c000, c100, c010, c110, c001, c101, c011, c111, rf, gf, bf, 16)
        def green = interpolateChannel(c000, c100, c010, c110, c001, c101, c011, c111, rf, gf, bf, 8)
        def blue = interpolateChannel(c000, c100, c010, c110, c001, c101, c011, c111, rf, gf, bf, 0)
        return formatColorCardPreviewHex((red << 16) | (green << 8) | blue)
    }
}

def refreshColorCardBuiltinHaldAssets = tasks.register("refreshColorCardBuiltinHaldAssets") {
    def sourceDirs = [
            rootProject.file("cube"),
            rootProject.file("胶片模拟"),
            rootProject.file("J"),
            colorCardClassicMemorySourceDir,
            colorCardBlackWhiteEraSourceDir
    ].findAll { it.exists() }
    def manifestFile = prebuiltBuiltinHaldManifestFile

    inputs.files(sourceDirs + colorCardExtraRootHaldSources.collect { spec -> spec.file })
    outputs.dir(prebuiltBuiltinHaldAssetsDir)
    outputs.file(manifestFile)

    doLast {
        prebuiltColorCardAssetsDir.mkdirs()
        delete(prebuiltBuiltinHaldAssetsDir)
        prebuiltBuiltinHaldAssetsDir.mkdirs()

        def ffmpegBinary = (System.getenv("FFMPEG_BINARY") ?: "ffmpeg").trim()
        def entries = []
        def seenIds = [] as Set
        def regularSourceDirs = sourceDirs.findAll { dir -> !dir.name.equalsIgnoreCase("J") }
        def jSeriesSourceDirs = sourceDirs.findAll { dir -> dir.name.equalsIgnoreCase("J") }
        def sourceFiles = regularSourceDirs.collectMany { dir ->
            fileTree(dir) {
                include "*.png"
            }.files
        }.sort { left, right -> left.absolutePath <=> right.absolutePath } +
                colorCardExtraRootHaldSources.collect { spec -> spec.file } +
                jSeriesSourceDirs.collectMany { dir ->
                    fileTree(dir) {
                        include "*.png"
                    }.files
                }.sort { left, right -> left.absolutePath <=> right.absolutePath }
        def extraRootSpecByPath = colorCardExtraRootHaldSources.collectEntries { spec ->
            [(spec.file.absolutePath): spec]
        }

        sourceFiles.eachWithIndex { File sourceFile, int index ->
            def haldLevel = detectColorCardHaldLevel(sourceFile)
            if (haldLevel == null) {
                logger.lifecycle("Skipping non-Hald asset: ${sourceFile.name}")
                return
            }

            def extraRootAsset = extraRootSpecByPath[sourceFile.absolutePath]
            def jSeriesAsset = parseColorCardJSeriesAsset(sourceFile)
            def isClassicMemoryAsset = colorCardClassicMemorySourceDir.exists() &&
                    sourceFile.parentFile?.canonicalPath == colorCardClassicMemorySourceDir.canonicalPath
            def isBlackWhiteEraAsset = colorCardBlackWhiteEraSourceDir.exists() &&
                    sourceFile.parentFile?.canonicalPath == colorCardBlackWhiteEraSourceDir.canonicalPath
            def title = extraRootAsset?.title ?: jSeriesAsset?.title ?: normalizeColorCardHaldTitle(sourceFile.name)
            def baseId = extraRootAsset?.assetId ?: (jSeriesAsset
                    ? jSeriesAsset.assetId
                    : isClassicMemoryAsset
                        ? "classic-memory-${slugifyColorCardHaldId(title)}"
                        : isBlackWhiteEraAsset
                            ? "black-white-era-${slugifyColorCardHaldId(title)}"
                            : slugifyColorCardHaldId(title))
            def uniqueId = baseId
            def duplicateIndex = 2
            while (!seenIds.add(uniqueId)) {
                uniqueId = "${baseId}-${duplicateIndex++}"
            }

            def previewImage = ImageIO.read(sourceFile)
            def previewColors = sampleColorCardHaldPreviewColors(previewImage, haldLevel)
            previewImage?.flush()

            def optimizedWebp = new File(temporaryDir, "${uniqueId}.webp")
            optimizedWebp.parentFile.mkdirs()
            optimizedWebp.delete()

            def shouldUseWebp = false
            try {
                def result = exec {
                    ignoreExitValue = true
                    commandLine ffmpegBinary,
                            "-hide_banner",
                            "-loglevel", "error",
                            "-y",
                            "-i", sourceFile.absolutePath,
                            "-c:v", "libwebp",
                            "-lossless", "1",
                            "-compression_level", "6",
                            "-q:v", "100",
                            optimizedWebp.absolutePath
                }
                shouldUseWebp = result.exitValue == 0 &&
                        optimizedWebp.exists() &&
                        optimizedWebp.length() > 0 &&
                        optimizedWebp.length() < sourceFile.length()
                if (shouldUseWebp) {
                    def sourceHash = computeColorCardRawRgbaHash(ffmpegBinary, sourceFile)
                    def webpHash = computeColorCardRawRgbaHash(ffmpegBinary, optimizedWebp)
                    shouldUseWebp = sourceHash != null && sourceHash == webpHash
                }
            } catch (Exception ignored) {
                shouldUseWebp = false
            }

            def outputExtension = shouldUseWebp ? "webp" : "png"
            def outputFile = new File(prebuiltBuiltinHaldAssetsDir, "${uniqueId}.${outputExtension}")
            copy {
                from(shouldUseWebp ? optimizedWebp : sourceFile)
                into(prebuiltBuiltinHaldAssetsDir)
                rename { outputFile.name }
            }

            entries << [
                    id           : uniqueId,
                    title        : title,
                    sourceTag    : jSeriesAsset ? "清新透亮" : "内置 Hald",
                    assetName    : "color_card_hald/${outputFile.name}",
                    haldLevel    : haldLevel,
                    previewColors: previewColors,
                    sortOrder    : index
            ]
        }

        manifestFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(entries)),
                "UTF-8"
        )
    }
}

