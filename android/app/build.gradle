        def bootstrapSpecs = (haldBootstrapSpecs + selectiveBootstrapSpecs + pixelBootstrapSpecs)
        def bootstrapManifestEntries = []
        def bootstrapTargetCount = generatedDemoEntries.isEmpty() || bootstrapSpecs.isEmpty()
                ? 0
                : bootstrapSpecs.size()
        if (!generatedDemoEntries.isEmpty() && !bootstrapSpecs.isEmpty()) {
            def preferredDemoEntries = generatedDemoEntries.findAll { it.id != "watermark_template_demo" }
            if (preferredDemoEntries.isEmpty()) {
                preferredDemoEntries = generatedDemoEntries
            }
            def emittedPreviewKeys = [] as Set
            def bootstrapIndex = 0
            bootstrapSpecs.eachWithIndex { spec, specIndex ->
                def demoEntry = preferredDemoEntries[specIndex % preferredDemoEntries.size()]
                def previewKey = "${spec.paletteId}:${demoEntry.assetName}"
                if (!emittedPreviewKeys.add(previewKey)) {
                    return
                }
                def filteredImage = spec.buildPreview.call(copyArgb(demoEntry.image as BufferedImage)) as BufferedImage
                def previewImage = buildFilteredPreview(filteredImage)
                def finalAssetName = writeOptimizedPreviewAsset(
                        previewImage,
                        "bootstrap_${bootstrapIndex}",
                        (spec.preserveSharpEdges ?: false) as boolean
                )
                bootstrapManifestEntries << [
                        paletteId    : spec.paletteId,
                        demoAssetName: demoEntry.assetName,
                        assetName    : finalAssetName
                ]
                bootstrapIndex++
            }
        }

        bootstrapManifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(bootstrapManifestEntries))

        if (usePrebuiltFeedAssets) {
            prebuiltColorCardAssetsDir.mkdirs()
            delete(prebuiltFilterFeedDemoDir)
            delete(prebuiltFilterFeedDemoManifestFile)
            delete(prebuiltFilterFeedBootstrapDir)
            delete(prebuiltFilterFeedBootstrapManifestFile)
            prebuiltFilterFeedDemoDir.mkdirs()
            prebuiltFilterFeedBootstrapDir.mkdirs()
            copy {
                from(outputDir)
                into(prebuiltFilterFeedDemoDir)
            }
            copy {
                from(manifestFile)
                into(prebuiltColorCardAssetsDir)
            }
            copy {
                from(bootstrapOutputDir)
                into(prebuiltFilterFeedBootstrapDir)
            }
            copy {
                from(bootstrapManifestFile)
                into(prebuiltColorCardAssetsDir)
            }
        }
    }
}
