// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.10"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.10"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:13.1.0"
        // A dependency ships Kotlin 2.4-built code (kotlin-stdlib 2.4.0 lands in the graph);
        // Kotlin 2.4 metadata needs R8 >= 9.1.29. Buildscript classpath resolves to the
        // highest r8 present (official override).
        classpath 'com.android.tools:r8:9.4.28'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
