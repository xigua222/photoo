# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Keep daemon heap below physical memory pressure and move heap base above
# low address space to avoid JVM native mmap failures (Windows 32-bit JVM).
# On macOS/Linux the HeapBaseMinAddress flag is harmless but unnecessary.
org.gradle.jvmargs=-Xmx3072m -XX:HeapBaseMinAddress=6g -Dfile.encoding=UTF-8
org.gradle.daemon=true

# Give Kotlin FIR a bit more headroom for large Compose source files while
# still staying below the main Gradle heap.
kotlin.daemon.jvmargs=-Xmx3072m
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true

# Disable local build cache to avoid occasional file-lock eviction failures
# (e.g. processReleaseResources R.jar deletion errors on Windows).
org.gradle.caching=false

# This project has custom Groovy tasks that are not configuration-cache safe yet.
org.gradle.configuration-cache=false

# This project is effectively a single heavy Android module, so project-level
# parallel mode adds memory pressure without helping much.
org.gradle.parallel=false

# Improve file change detection and keep worker fan-out predictable.
org.gradle.vfs.watch=true
org.gradle.workers.max=2

# --- macOS / cross-platform build settings ---
# Use prebuilt MNN JNI libs to bypass NDK source-build (PowerShell) entirely.
# Set to true on macOS/Linux where the PowerShell build script is unavailable.
usePrebuiltMnnJni=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
